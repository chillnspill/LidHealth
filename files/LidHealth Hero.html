<title>LidHealth Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
  /* Layout: copy on the left, bottle on the right, mist drifting up and out into the empty space beside it. One committed light look. */
  :root {
    --ground: #F1EDF8;
    --ground-deep: #E6DFF2;
    --paper: #FBFAFE;
    --ink: #2B1553;
    --ink-soft: #5E4F7D;
    --brand: #521A8E;
    --brand-deep: #3F1473;
    --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
    --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  .wrap { max-width: 1180px; margin-inline: auto; position: relative; }

  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding-block: 24px;
  }
  .bar img { display: block; height: 34px; width: auto; max-width: 60vw; }
  .bar nav { display: flex; gap: 28px; }
  .bar a, .link {
    color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.02em;
  }
  .bar a:hover { color: var(--brand); }

  .hero {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center;
    gap: 24px;
    padding-block: 28px 72px;
  }
  .copy { position: relative; z-index: 2; max-width: 520px; display: flex; flex-direction: column; gap: 24px; }
  .eyebrow {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: var(--brand);
  }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: clamp(2.6rem, 5.6vw, 4.6rem); line-height: 1.02; letter-spacing: -0.02em;
    text-wrap: balance; color: var(--ink);
  }
  h1 em { font-style: italic; color: var(--brand); }
  .lede { margin: 0; max-width: 44ch; font-size: 1.0625rem; color: var(--ink-soft); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 15px 28px; border-radius: 999px; background: var(--brand); color: #fff;
    font-weight: 600; font-size: 15px; letter-spacing: 0.02em; text-decoration: none;
    transition: background-color .2s ease, transform .2s ease;
  }
  .btn:hover { background: var(--brand-deep); transform: translateY(-1px); }
  .link { border-bottom: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); padding-bottom: 2px; }
  .link:hover { color: var(--brand); border-color: var(--brand); }
  .btn:focus-visible, .link:focus-visible, .bar a:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }

  .stage { position: relative; display: grid; place-items: end center; min-height: 560px; padding-top: 40px; }
  .halo {
    position: absolute; left: 50%; bottom: 8%; width: min(120%, 560px); aspect-ratio: 1; transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(closest-side, var(--paper) 0%, color-mix(in srgb, var(--paper) 55%, transparent) 55%, transparent 100%);
  }
  .floor {
    position: absolute; left: 50%; bottom: -6px; width: 56%; height: 26px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(63, 20, 115, 0.26), transparent 100%);
    filter: blur(5px);
  }
  .bottle {
    position: relative; z-index: 1; display: block;
    height: clamp(360px, 52vh, 500px); width: auto; max-width: 100%;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 22px 26px rgba(63, 20, 115, 0.18));
    transition: transform .16s ease-out;
  }
  .bottle.press { transform: translateY(3px) rotate(-0.5deg); }
  .spec {
    position: absolute; right: 0; bottom: 14px; z-index: 2; margin: 0;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft);
    writing-mode: vertical-rl; transform: rotate(180deg);
  }

  #mist { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  @media (max-width: 860px) {
    .bar nav { display: none; }
    .hero { grid-template-columns: minmax(0, 1fr); padding-block: 12px 56px; gap: 8px; }
    .copy { max-width: none; }
    .stage { min-height: 440px; padding-top: 150px; }
    .bottle { height: 340px; }
    .spec { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .bottle { transition: none; }
  }
</style>

<script>
(function () {
  var hero = document.getElementById('hero');
  var bottle = document.getElementById('bottle');
  var cv = document.getElementById('mist');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, parts = [], drops = [], emitLeft = 0, last = 0, running = false, timer = null;

  function resize() {
    var r = hero.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function nozzle() {
    var h = hero.getBoundingClientRect(), b = bottle.getBoundingClientRect();
    return { x: b.left - h.left + b.width * 0.53, y: b.top - h.top + b.height * 0.07 };
  }

  function emit(n) {
    var o = nozzle();
    var narrow = W < 700;
    var base = narrow ? -62 : -34;           // degrees, up and to the right
    for (var i = 0; i < n; i++) {
      var ang = (base + (Math.random() - 0.5) * 36) * Math.PI / 180;
      var sp = 4 + Math.random() * (narrow ? 4 : 6);
      parts.push({
        x: o.x + (Math.random() - 0.5) * 4, y: o.y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        r: 3 + Math.random() * 4, g: 0.55 + Math.random() * 0.5,
        life: 0, max: 100 + Math.random() * 70,
        peak: 0.10 + Math.random() * 0.1, warm: Math.random() < 0.35
      });
    }
    for (var j = 0; j < Math.ceil(n / 2); j++) {
      var a2 = (base + (Math.random() - 0.5) * 30) * Math.PI / 180;
      var s2 = 6 + Math.random() * 7;
      drops.push({ x: o.x, y: o.y, vx: Math.cos(a2) * s2, vy: Math.sin(a2) * s2, r: 0.8 + Math.random() * 1.3, life: 0, max: 34 + Math.random() * 30 });
    }
  }

  function step(dt) {
    var k = dt / 16.67, i, p;
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.life += k;
      var drag = Math.pow(0.955, k);
      p.vx *= drag; p.vy *= drag;
      p.vy -= 0.012 * k;                     // slight lift, mist rises as it thins
      p.x += p.vx * k; p.y += p.vy * k;
      p.r += p.g * k;
      if (p.life >= p.max) parts.splice(i, 1);
    }
    for (i = drops.length - 1; i >= 0; i--) {
      p = drops[i];
      p.life += k; p.vx *= Math.pow(0.93, k); p.vy *= Math.pow(0.93, k);
      p.x += p.vx * k; p.y += p.vy * k;
      if (p.life >= p.max) drops.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var i, p, t, a, gr;
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; t = p.life / p.max;
      a = p.peak * Math.min(1, t * 8) * Math.pow(1 - t, 1.6);
      gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      if (p.warm) { gr.addColorStop(0, 'rgba(255,255,255,' + (a * 2.2) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)'); }
      else { gr.addColorStop(0, 'rgba(120,76,190,' + a + ')'); gr.addColorStop(1, 'rgba(120,76,190,0)'); }
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    for (i = 0; i < drops.length; i++) {
      p = drops[i]; t = p.life / p.max;
      ctx.fillStyle = 'rgba(82,26,142,' + (0.5 * (1 - t)) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
  }

  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(48, ts - last); last = ts;
    if (emitLeft > 0) { var n = Math.min(emitLeft, 3); emit(n); emitLeft -= n; }
    step(dt); draw();
    if (parts.length || drops.length || emitLeft > 0) requestAnimationFrame(frame);
    else { running = false; last = 0; }
  }

  function spray() {
    bottle.classList.add('press');
    setTimeout(function () { bottle.classList.remove('press'); }, 190);
    setTimeout(function () {
      emitLeft = 30;
      if (!running) { running = true; requestAnimationFrame(frame); }
    }, 90);
  }

  function still() {
    // reduced motion: draw one settled puff and stop
    for (var b = 0; b < 40; b++) emit(1);
    for (var s = 0; s < 40; s++) step(16.67);
    draw(); parts = []; drops = [];
  }

  function loop() { spray(); timer = setTimeout(loop, 4600); }

  function start() {
    resize();
    if (reduce) { still(); return; }
    setTimeout(loop, 900);
  }

  var ro = window.ResizeObserver ? new ResizeObserver(function () { resize(); if (reduce) still(); }) : null;
  if (ro) ro.observe(hero); else window.addEventListener('resize', resize);
  bottle.addEventListener('click', function () { if (!reduce) { clearTimeout(timer); loop(); } });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(timer); } else if (!reduce) { clearTimeout(timer); timer = setTimeout(loop, 600); }
  });
  if (bottle.complete) start(); else bottle.addEventListener('load', start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
